<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="640" viewBox="0 0 1440 640"><rect width="1440" height="640" rx="30" fill="#16263a"/><g font-family="Arial,sans-serif"><text x="64" y="70" fill="#b8cbb0" font-size="16" letter-spacing="3">ARHQ / LOCAL PERFORMANCE</text><text x="64" y="136" fill="white" font-size="43" font-weight="bold">A clearer view of local discovery.</text><text x="64" y="182" fill="#b7c3d2" font-size="20">Evidence summary created from supplied Localo and Google Business Profile screenshots.</text><rect x="64" y="235" width="410" height="230" rx="18" fill="#1e3148"/><text x="92" y="320" fill="#b8cbb0" font-size="62" font-weight="bold">43%</text><text x="92" y="367" fill="white" font-size="23">Localo visibility</text><text x="92" y="410" fill="#b7c3d2" font-size="17">Tool displays +7% vs last 30 days</text><rect x="502" y="235" width="410" height="230" rx="18" fill="#1e3148"/><text x="530" y="320" fill="#b8cbb0" font-size="62" font-weight="bold">368</text><text x="530" y="367" fill="white" font-size="23">Profile views</text><text x="530" y="410" fill="#b7c3d2" font-size="17">Tool displays +86 vs last month</text><rect x="940" y="235" width="410" height="230" rx="18" fill="#1e3148"/><text x="968" y="320" fill="#b8cbb0" font-size="62" font-weight="bold">6 / 10</text><text x="968" y="367" fill="white" font-size="23">Keywords showing Rank 1</text><text x="968" y="410" fill="#b7c3d2" font-size="17">Tracked keyword snapshot only</text><text x="64" y="525" fill="white" font-size="20">15 Business Profile calls shown for Dec 2025–Feb 2026.</text><text x="64" y="566" fill="#b7c3d2" font-size="17">The displayed call trend declines. These screenshots do not verify the separate 67% online-growth claim.</text><text x="64" y="605" fill="#b7c3d2" font-size="15">Designed evidence summary • not a native analytics export • snapshot dates and comparison windows vary</text></g></svg>